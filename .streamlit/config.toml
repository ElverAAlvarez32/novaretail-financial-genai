[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#101D2E"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
borderColor = "#24344D"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
showSidebarBorder = true
chartCategoricalColors = [
    "#38BDF8",
    "#2DD4BF",
    "#A78BFA",
    "#F59E0B",
    "#FB7185",
    "#22C55E",
    "#60A5FA",
    "#E879F9"
]

[server]
runOnSave = true
headless = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"